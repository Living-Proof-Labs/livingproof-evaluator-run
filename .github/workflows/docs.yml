name: Verify and publish documentation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Local adoption override: this initial docs scaffold uses locked Python
    # tooling; Docker/image/Task adoption is deferred (docs/verification.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9
        with:
          version: '0.13.6'
          python-version: '3.12.14'
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --no-sync python tools/docs.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evaluator-documentation-review
          path: site/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale publication inside deployment lock
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          current=$(timeout 30s git -c credential.helper= ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main)
          [[ "$current" =~ ^([0-9a-f]{40})[[:space:]]refs/heads/main$ ]]
          if [[ "${BASH_REMATCH[1]}" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipped stale source revision.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.freshness.outputs.current == 'true'
        with:
          name: evaluator-documentation-review
          path: site
      - name: Check identity and package site
        if: steps.freshness.outputs.current == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          identity = json.load(open('site/build.json'))
          assert identity['source_commit'] == os.environ['GITHUB_SHA']
          assert identity['source_dirty'] is False
          PY
          tar --dereference --hard-dereference -C site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.freshness.outputs.current == 'true'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: steps.freshness.outputs.current == 'true'
        id: deployment
