[project]
name = "livingproof-evaluator-run"
dynamic = ["version"]
description = "Evaluates run infrastructure and evidence suitability for judging robot capabilities."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcap==1.6.0",
]

[dependency-groups]
dev = [
    "defusedxml==0.7.1",
    "jsonschema==4.26.0",
    "pytest==8.4.2",
    "ruff==0.14.2",
]
docs = [
    "zensical==0.0.73",
]

[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.1.dev0"

[tool.hatch.build.targets.wheel]
packages = ["src/livingproof_evaluator_run"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
